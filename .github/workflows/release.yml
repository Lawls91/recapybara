# Release (slice 19): a pushed tag vX.Y.Z (scripts/release.ps1 makes one), or a run by hand with a version, builds the
# per-user MSI, signs it with the updater key and publishes a GitHub Release holding the MSI, its .sig and latest.json,
# which the app's updater reads from releases/latest. A tag vX.Y.Z-suffix makes a pre-release, which releases/latest
# (and so the app) never offers. Only tags and runs by hand get here, never a pull request, so no PR run sees the secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (must match the app version; tags this commit vX.Y.Z)
        required: true

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Through env, never pasted into a script: an input is text, not code.
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: npm ci
        run: npm ci

      # Fails the run before anything is built when the tag and tauri.conf.json, the app crate and package.json disagree.
      - name: Tag matches the app version
        id: release
        run: node scripts/release.mjs check $env:TAG >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the MSI
        run: npm run msi

      # A broken cabinet never ships: an administrative extract (no install, nothing registered) must unpack the exe
      # byte for byte as built, or the run fails before anything is signed or published.
      - name: The MSI unpacks
        run: |
          $msi = (Resolve-Path '${{ steps.release.outputs.msi }}').Path
          $dir = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $log = Join-Path $env:RUNNER_TEMP 'msi-extract.log'
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dir`"", '/l*v', "`"$log`""
          $exe = Get-ChildItem $dir -Recurse -Filter recapybara.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $built = (Get-FileHash out/payload/recapybara.exe).Hash # what build-msi.ps1 packed
          $got = if ($exe) { (Get-FileHash $exe.FullName).Hash }
          if ($p.ExitCode -ne 0 -or $got -ne $built) {
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            Write-Error "the MSI doesn't unpack (msiexec $($p.ExitCode), exe hash '$got', built '$built')"
            exit 1
          }
          "unpacked $($exe.FullName), SHA256 $got, as built"

      - name: Sign the MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item '${{ steps.release.outputs.msi }}' 'out/release/${{ steps.release.outputs.asset }}'
          # Bound to the version: the app requires it (requireSignedVersion), so a tampered latest.json can't pair a
          # newer version number with an older signed MSI.
          npx tauri signer sign --app-version '${{ steps.release.outputs.version }}' 'out/release/${{ steps.release.outputs.asset }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: latest.json
        run: |
          node scripts/release.mjs manifest $env:TAG 'out/release/${{ steps.release.outputs.asset }}.sig' '${{ github.repository }}' | Out-File -Encoding utf8NoBOM out/release/latest.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content out/release/latest.json

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ('${{ steps.release.outputs.prerelease }}' -eq 'true') { '--prerelease' } else { '--latest' }
          $assets = (Get-ChildItem out/release).FullName # pwsh expands no wildcard for a native command
          gh release create $env:TAG @assets --target $env:GITHUB_SHA --title $env:TAG --generate-notes $pre
          if ($LASTEXITCODE -ne 0) { exit 1 }
