# Release: one run by hand on main (Actions, Release, Run workflow, or gh workflow run Release) makes a
# release. It picks the version (the input, or the latest vX.Y.Z tag's next minor), stamps it into this runner's copy
# only (nothing is committed: main keeps the last released version), builds the per-user MSI, signs it with the
# updater key and publishes a GitHub Release holding the MSI, its .sig and latest.json, which the app's updater reads
# from releases/latest. gh release create makes the tag on this commit. Never a pull request, so no PR run sees the
# secrets.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (blank for the latest release's next minor version)
        required: false
        default: ""

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          Write-Error "Release runs only on main, not $env:GITHUB_REF"
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags: the version and the notes start from the latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: npm ci
        run: npm ci

      # Fails the run before anything is built when the version isn't X.Y.Z or its tag already exists.
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }} # through env, never pasted into a script: an input is text, not code
        run: |
          $out = node scripts/release.mjs version "$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          $out >> $env:GITHUB_OUTPUT
          (@($out) -match '^tag=') -replace '^tag=', 'TAG=' >> $env:GITHUB_ENV

      # This runner's copy only: no commit, no push.
      - name: Stamp the version
        id: release
        run: |
          node scripts/release.mjs bump '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/release.mjs check $env:TAG >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # release-notes/<tag>.md if main has one, else the commit subjects since the last release: the release's body and
      # latest.json's notes (What's new in the app).
      - name: Release notes
        run: |
          node scripts/release.mjs notes $env:TAG '${{ steps.version.outputs.prev }}' | Out-File -Encoding utf8NoBOM "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content "$env:RUNNER_TEMP/notes.md"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the MSI
        run: npm run msi

      # A broken cabinet never ships: an administrative extract (no install, nothing registered) must unpack the exe
      # byte for byte as built, or the run fails before anything is signed or published.
      - name: The MSI unpacks
        run: |
          $msi = (Resolve-Path '${{ steps.release.outputs.msi }}').Path
          $dir = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $log = Join-Path $env:RUNNER_TEMP 'msi-extract.log'
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dir`"", '/l*v', "`"$log`""
          $exe = Get-ChildItem $dir -Recurse -Filter recapybara.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $built = (Get-FileHash out/payload/recapybara.exe).Hash # what build-msi.ps1 packed
          $got = if ($exe) { (Get-FileHash $exe.FullName).Hash }
          if ($p.ExitCode -ne 0 -or $got -ne $built) {
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            Write-Error "the MSI doesn't unpack (msiexec $($p.ExitCode), exe hash '$got', built '$built')"
            exit 1
          }
          "unpacked $($exe.FullName), SHA256 $got, as built"

      - name: Sign the MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item '${{ steps.release.outputs.msi }}' 'out/release/${{ steps.release.outputs.asset }}'
          # Bound to the version: the app requires it (requireSignedVersion), so a tampered latest.json can't pair a
          # newer version number with an older signed MSI.
          npx tauri signer sign --app-version '${{ steps.release.outputs.version }}' 'out/release/${{ steps.release.outputs.asset }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: latest.json
        run: |
          node scripts/release.mjs manifest $env:TAG 'out/release/${{ steps.release.outputs.asset }}.sig' '${{ github.repository }}' "$env:RUNNER_TEMP/notes.md" | Out-File -Encoding utf8NoBOM out/release/latest.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content out/release/latest.json

      # Makes the tag vX.Y.Z on this commit, and the release, marked latest so the app's updater finds it.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem out/release).FullName # pwsh expands no wildcard for a native command
          gh release create $env:TAG @assets --target $env:GITHUB_SHA --title $env:TAG --notes-file "$env:RUNNER_TEMP/notes.md" --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
