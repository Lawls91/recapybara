# Release: one run by hand on main (Actions, Release, Run workflow, or gh workflow run Release) makes a
# release. It picks the version (the input, or the latest vX.Y.Z tag's next minor), stamps it into each runner's copy
# only (nothing is committed: main keeps the last released version), builds the per-user MSI on Windows and the Apple
# Silicon app on macOS (ad-hoc signed, not notarised), signs each update package with the updater key and publishes a
# GitHub Release holding the MSI, the Mac disk image and .app.tar.gz, their .sig files and one latest.json for both,
# which the app's updater reads from releases/latest. gh release create makes the tag on this commit. Never a pull
# request, so no PR run sees the secrets.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (blank for the latest release's next minor version)
        required: false
        default: ""

concurrency:
  group: release

permissions:
  contents: write

jobs:
  # The version and the notes, once, for both builds. Fails the run before anything is built when the version isn't
  # X.Y.Z or its tag already exists.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release runs only on main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags: the version and the notes start from the latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }} # through env, never pasted into a script: an input is text, not code
        run: |
          out=$(node scripts/release.mjs version "$VERSION")
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

      # release-notes/<tag>.md if main has one, else the commit subjects since the last release: the release's body and
      # latest.json's notes (What's new in the app).
      - name: Release notes
        run: |
          mkdir -p out
          node scripts/release.mjs notes '${{ steps.version.outputs.tag }}' '${{ steps.version.outputs.prev }}' > out/notes.md
          cat out/notes.md

      - uses: actions/upload-artifact@v5
        with:
          name: notes
          path: out/notes.md

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: npm ci
        run: npm ci

      # This runner's copy only: no commit, no push.
      - name: Stamp the version
        id: release
        run: |
          node scripts/release.mjs bump '${{ needs.prepare.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/release.mjs check $env:TAG >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the MSI
        run: npm run msi

      # A broken cabinet never ships: an administrative extract (no install, nothing registered) must unpack the exe
      # byte for byte as built, or the run fails before anything is signed or published.
      - name: The MSI unpacks
        run: |
          $msi = (Resolve-Path '${{ steps.release.outputs.msi }}').Path
          $dir = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $log = Join-Path $env:RUNNER_TEMP 'msi-extract.log'
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dir`"", '/l*v', "`"$log`""
          $exe = Get-ChildItem $dir -Recurse -Filter recapybara.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $built = (Get-FileHash out/payload/recapybara.exe).Hash # what build-msi.ps1 packed
          $got = if ($exe) { (Get-FileHash $exe.FullName).Hash }
          if ($p.ExitCode -ne 0 -or $got -ne $built) {
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            Write-Error "the MSI doesn't unpack (msiexec $($p.ExitCode), exe hash '$got', built '$built')"
            exit 1
          }
          "unpacked $($exe.FullName), SHA256 $got, as built"

      - name: Sign the MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item '${{ steps.release.outputs.msi }}' 'out/release/${{ steps.release.outputs.asset }}'
          # Bound to the version: the app requires it (requireSignedVersion), so a tampered latest.json can't pair a
          # newer version number with an older signed MSI.
          npx tauri signer sign --app-version '${{ steps.release.outputs.version }}' 'out/release/${{ steps.release.outputs.asset }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: out/release/

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: npm ci
        run: npm ci

      # This runner's copy only: no commit, no push.
      - name: Stamp the version
        id: release
        run: |
          node scripts/release.mjs bump '${{ needs.prepare.outputs.version }}'
          node scripts/release.mjs check "$TAG" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # tauri.macos.conf.json: the .app and .dmg, ad-hoc signed ("-"), no notarisation.
      - name: Build the app and disk image
        run: npx tauri build --bundles app,dmg

      # The updater's package is the .app in a .tar.gz. A broken one never ships: unpacked, its signature must verify
      # and its executable must be the one just built, byte for byte.
      - name: The update package unpacks
        run: |
          mkdir -p out/release "$RUNNER_TEMP/unpack"
          app=target/release/bundle/macos/Recapybara.app
          tar -czf 'out/release/${{ steps.release.outputs.macUpdate }}' -C "$(dirname "$app")" "$(basename "$app")"
          tar -xzf 'out/release/${{ steps.release.outputs.macUpdate }}' -C "$RUNNER_TEMP/unpack"
          codesign --verify --deep --strict "$RUNNER_TEMP/unpack/Recapybara.app"
          cmp "$app/Contents/MacOS/recapybara" "$RUNNER_TEMP/unpack/Recapybara.app/Contents/MacOS/recapybara"
          cp target/release/bundle/dmg/*.dmg 'out/release/${{ steps.release.outputs.dmg }}'
          ls -l out/release

      - name: Sign the update package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Bound to the version, as the MSI's is (requireSignedVersion).
        run: npx tauri signer sign --app-version '${{ steps.release.outputs.version }}' 'out/release/${{ steps.release.outputs.macUpdate }}'

      - uses: actions/upload-artifact@v5
        with:
          name: release-macos
          path: out/release/

  publish:
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Stamp the version
        id: release
        run: |
          node scripts/release.mjs bump '${{ needs.prepare.outputs.version }}'
          node scripts/release.mjs check "$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          path: out/release
          merge-multiple: true
          pattern: release-*

      - uses: actions/download-artifact@v5
        with:
          name: notes
          path: out

      - name: latest.json
        run: |
          node scripts/release.mjs manifest "$TAG" '${{ github.repository }}' out/notes.md \
            'windows-x86_64=out/release/${{ steps.release.outputs.asset }}.sig' \
            'darwin-aarch64=out/release/${{ steps.release.outputs.macUpdate }}.sig' > out/release/latest.json
          cat out/release/latest.json

      # Makes the tag vX.Y.Z on this commit, and the release, marked latest so the app's updater finds it.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" out/release/* --target "$GITHUB_SHA" --title "$TAG" --notes-file out/notes.md --latest
