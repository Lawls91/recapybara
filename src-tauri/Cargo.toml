[package]
name = "meeting-capture"
version = "0.1.0"
edition = "2021"
default-run = "meeting-capture"

[lib]
name = "meeting_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
# Already in the tree through tauri; only the Recycle Bin call (D30) is added.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }
# Already in the tree through tauri-plugin-autostart: the Run value written again, quoted.
windows-registry = "0.6"
